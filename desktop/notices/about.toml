# cargo-about: the licenses of the Rust crates in the desktop app, for THIRD-PARTY-NOTICES.txt
# (scripts/notices.mjs). Where a crate offers a choice, the first license listed here wins.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
]
# Every platform the desktop app is released for, in one list
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
# Only what ends up in the app; Klirr's own crates (publish = false) are not third-party
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
