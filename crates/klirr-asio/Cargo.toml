[package]
name = "klirr-asio"
description = "Opens an ASIO driver's own control panel, which cpal does not offer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Windows only; elsewhere the crate is empty.
[target.'cfg(windows)'.dependencies]
# The same asio-sys cpal uses (`links = "asio"` allows only one): its library holds the
# ASIO SDK, whose `ASIOControlPanel` this crate calls.
asio-sys = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

# Same as the workspace lints, except that `unsafe_code` is denied rather than forbidden:
# calling into the ASIO SDK and Win32 needs it, allowed on exactly those calls.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
