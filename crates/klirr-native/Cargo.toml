[package]
name = "klirr-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native audio host of Klirr: the DSP core on WASAPI, ASIO, Core Audio, ALSA or JACK"
publish = false

[dependencies]
klirr-dsp = { path = "../klirr-dsp" }
cpal = "0.18"
rtrb = "0.4"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
# WASAPI exclusive mode, through safe bindings (this crate stays free of unsafe code).
wasapi = "0.27"
# The ASIO driver's control panel (the one call cpal does not offer).
klirr-asio = { path = "../klirr-asio", optional = true }

[features]
# ASIO on Windows. Needs LLVM (libclang) to build; see the README.
asio = ["cpal/asio", "dep:klirr-asio"]

[lints]
workspace = true
