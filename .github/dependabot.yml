version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Listed in package.json only so npm on Windows keeps them in the lock file (`npm ci`
      # on Linux fails without them). Their version must match what rolldown's wasm32
      # binding asks for, so update them together with vite, by hand.
      - dependency-name: "@emnapi/*"
      # TypeScript 7.0 has no programmatic API, so typescript-eslint cannot run on it.
      # Its support is planned for 7.1; Dependabot offers that one again.
      - dependency-name: typescript
        versions: ["7.0.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its refs are toolchains, not versions: `@stable`, and `@1.85` for the
      # minimum-Rust job, which must stay on the minimum.
      - dependency-name: dtolnay/rust-toolchain
